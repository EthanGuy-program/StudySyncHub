<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Loading Bar</title>
    <style>
        body { margin: 0; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #loadingBox {
            width: 100%;
            height: 20px;
            position: absolute;
            top: 50%;
            margin-top: -10px;
            text-align: center;
            z-index: 1000; /* Ensure it is on top of everything */
        }
        #bgBar {
            position: absolute;
            width: 200px;
            margin-left: -100px;
            left: 50%;
            height: 2px;
            background-color: #333;
            border-radius: 2px;
        }
        #progressBar {
            position: absolute;
            margin-left: -100px;
            left: 50%;
            width: 0px;
            height: 2px;
            background-color: white;
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        #loadingInfo {
            position: absolute;
            width: 100%;
            top: 100%;
            margin-top: 5px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="loadingBox">
        <div id="bgBar"></div>
        <div id="progressBar"></div>
        <p id="loadingInfo">Loading...</p>
    </div>
    <canvas id="webgl-canvas"></canvas>
    <script type="x-shader/x-vertex" id="vertex-shader">
        #version 300 es
        precision highp float;
        
        in vec2 a_position;
        out vec2 v_uv;
        
        void main() {
            v_uv = a_position * 0.5 + 0.5; // Transform position to UV coordinates [0, 1]
            gl_Position = vec4(a_position, 0.0, 1.0); // Position in clip space
        }        
    </script>

    <script type="x-shader/x-fragment" id="fragment-shader">
#version 300 es
precision highp float;

uniform vec2 u_resolution;
uniform float u_time;
uniform vec3 u_cameraPosition;
uniform mat3 u_cameraOrientation;
uniform vec3 u_lightPosition; // Light position
uniform vec3 u_emissionColor; // Self-illumination color

out vec4 fragColor;

// Signed Distance Function for box
float boxSDF(vec3 p, vec3 b) {
    vec3 d = abs(p) - b;
    return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0);
}

// Map function to repeat the box in the x and z directions
// Properly aligned box SDF
float map(vec3 p) {
    vec3 q = p;
    
    // Snap to a strict 2x2 grid
    q.x = round(p.x / 2.0) * 2.0;
    q.z = round(p.z / 2.0) * 2.0;

    return boxSDF(p - q, vec3(0.5, 0.5, 0.5)); // Box size remains the same
}


// Calculate normal using central difference
vec3 getNormal(vec3 p) {
    const float eps = 0.001;
    vec2 e = vec2(1.0, -1.0) * eps;
    return normalize(e.xyy * map(p + e.xyy) +
                     e.yyx * map(p + e.yyx) +
                     e.yxy * map(p + e.yxy) +
                     e.xxx * map(p + e.xxx));
}

// Ambient Occlusion Approximation
float ambientOcclusion(vec3 p, vec3 normal) {
    float occlusion = 0.0;
    const int steps = 5;
    float stepSize = 0.1;

    for (int i = 1; i <= steps; i++) {
        vec3 samplePos = p + normal * (stepSize * float(i));
        float dist = map(samplePos);
        occlusion += smoothstep(0.0, stepSize, dist);
    }
    
    return clamp(1.0 - (occlusion / float(steps)), 0.5, 1.0);
}

// Shadow calculation
float shadow(vec3 p, vec3 lightDir) {
    float shadow = 1.0;
    const float shadowBias = 0.001;
    vec3 shadowRay = p + lightDir * shadowBias;
    float dist = map(shadowRay);
    return dist < length(lightDir) ? 0.0 : shadow;
}

// Raymarching algorithm
vec3 raymarch(vec3 ro, vec3 rd) {
    float totalDist = 0.0;
    const int maxSteps = 100;
    const float maxDist = 100.0;
    const float surfaceDist = 0.001;

    for (int i = 0; i < maxSteps; i++) {
        vec3 p = ro + totalDist * rd;
        float dist = map(p);
        totalDist += dist;
        if (dist < surfaceDist || totalDist > maxDist) break;
    }

    vec3 p = ro + totalDist * rd;
    vec3 normal = getNormal(p);
    vec3 lightDir = normalize(u_lightPosition - p);
    vec3 viewDir = normalize(u_cameraPosition - p);

    float diffuse = max(dot(normal, lightDir), 0.0);
    float shadowFactor = shadow(p, lightDir);
    float ao = ambientOcclusion(p, normal);

    // Self-illumination & diffuse shading with AO
    vec3 color = (1.0 - shadowFactor) * (diffuse * vec3(1.0) + u_emissionColor);
    color *= ao;

    return color;
}

void main() {
    vec2 uv = (gl_FragCoord.xy / u_resolution) * 2.0 - 1.0;
    
    // Adjust for aspect ratio and FOV
    float aspect = u_resolution.x / u_resolution.y;
    float fov = 1.0; // Field of view (adjust as needed)
    uv.x *= aspect * fov;
    uv.y *= fov;

    // Calculate ray direction with perspective
    vec3 ro = u_cameraPosition;
    vec3 rd = normalize(u_cameraOrientation * vec3(uv, 1.0));

    // Perform raymarching
    vec3 color = raymarch(ro, rd);

    // Bloom effect
    float brightness = dot(color, vec3(0.2126, 0.7152, 0.0722)); // Luminance
    vec3 bloom = vec3(0.0);
    if (brightness > 0.8) { // Threshold for bloom
        bloom = color * (brightness - 0.8) * 2.0; // Intensity of bloom
    }

    // Combine color and bloom
    vec3 finalColor = color + bloom;

    // Fade-in effect (optional)
    float fadeFactor = (u_time / max(u_time, 10.0));

    // Output final color
    fragColor = vec4(finalColor * fadeFactor, 1.0);
}

    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/3.4.2/gl-matrix-min.js"></script>
    <script src="Js/main.js"></script>
</body>
</html>
