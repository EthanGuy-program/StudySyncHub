<!DOCTYPE html>
<html lang="en" class="size-medium">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows 95 Revival with Gradient</title>
  <link rel="icon" type="image/x-icon" href="icon.ico" id="icono" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="./styles.css" />
  <script src="./script.js"></script>
</head>
  <body style="margin:0; padding:0; background:#222;">
    <!-- your elements without size-medium class -->
    <div class="gradient-layer" style="position:absolute; top:27px; left:27px;">
      Gradient Accent
      <img src="Images/untitled.png" alt="End Icon" />
    </div>

    <div class="window" style="position:absolute; top:60px; left:27px;">
      Hello world
      <button class="action-button" type="button">Look at it</button>
    </div>

  <!-- HUD bar fixed at bottom -->
  <div class="hud-bar" style="position:fixed; bottom:0; left:0; width:100%; height:3%;">
    <div class="start-button size-medium" tabindex="0">
      <img src="Images/Microsoft.png" alt="Start" /> Start
    </div>
  </div>

  <!-- Movable widget above HUD -->
  <div class="movable-widget" style="position:fixed; bottom:40px; left:27px; width:80px; height:10px;">
    <button class="size-medium" type="button">Chill Music</button>
  </div>

  <!-- Hidden iframe -->
  <iframe class="embedded-frame" src="" title="Game Frame"></iframe>

</body>
</html>
